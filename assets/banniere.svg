<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="ARAC-BRAIN — Claude Desktop pour réfléchir. Claude Code pour construire. ARAC-BRAIN pour se souvenir.">
  <title>ARAC-BRAIN</title>
  <desc>Bannière du dépôt. Un cerveau personnel qui transforme vos conversations en mémoire retrouvable.</desc>

  <!--
    La bannière porte son propre fond : elle reste lisible quel que soit le thème
    de qui la regarde. Aucune police externe — les visionneuses n'en chargent pas,
    et un texte qui retombe sur une police de substitution casse une mise en page.
  -->

  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#131a24"/>
      <stop offset="100%" stop-color="#0b1420"/>
    </linearGradient>
    <radialGradient id="lueur" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#fond)"/>
  <circle cx="232" cy="200" r="190" fill="url(#lueur)"/>

  <!-- la marque, à l'échelle -->
  <g transform="translate(140,108) scale(2.875)" color="#e6edf3">
    <g fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" opacity="0.42">
      <path d="M17 19 L26 14 M17 19 L21 27 M26 14 L21 27 M21 27 L13 28 M13 28 L17 19"/>
      <path d="M47 22 L52 32 M47 22 L44 34 M52 32 L44 34"/>
      <path d="M24 44 L33 50 M24 44 L17 50 M33 50 L17 50"/>
      <path d="M21 27 L35 31 M35 31 L44 34 M35 31 L24 44"/>
    </g>
    <g fill="currentColor">
      <circle cx="17" cy="19" r="2.6"/><circle cx="26" cy="14" r="2"/>
      <circle cx="13" cy="28" r="2"/><circle cx="47" cy="22" r="2.3"/>
      <circle cx="52" cy="32" r="1.8"/><circle cx="44" cy="34" r="2.3"/>
      <circle cx="24" cy="44" r="2.6"/><circle cx="33" cy="50" r="2"/>
      <circle cx="17" cy="50" r="1.8"/><circle cx="35" cy="31" r="2.3"/>
    </g>
    <circle cx="21" cy="27" r="3.4" fill="#7dd3fc"/>
    <circle cx="21" cy="27" r="6.6" fill="none" stroke="#7dd3fc" stroke-width="1.1" opacity="0.6"/>
  </g>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="470" y="168" fill="#e6edf3" font-size="76" font-weight="700" letter-spacing="2">ARAC-BRAIN</text>
    <text x="474" y="216" fill="#7dd3fc" font-size="23" font-weight="500" letter-spacing="0.4">
      Un cerveau personnel, construit à partir de vos conversations.
    </text>

    <g fill="#8b949e" font-size="21">
      <text x="474" y="272">Claude Desktop pour réfléchir.</text>
      <text x="474" y="302">Claude Code pour construire.</text>
      <text x="474" y="332" fill="#c9d1d9">ARAC-BRAIN pour se souvenir.</text>
    </g>
  </g>

  <rect x="0" y="396" width="1280" height="4" fill="#7dd3fc" opacity="0.5"/>
</svg>
