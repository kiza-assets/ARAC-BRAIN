# ============================================================================
# GABARIT — la porte du cerveau « @@BASE@@ », côté serveur
# ============================================================================
#
# CE FICHIER NE SE COPIE PAS. Il se REND, sous un nom qui porte le cerveau :
#
#     sudo ./deploy/ssh/rendre-pont.sh --poser
#     # → /etc/ssh/sshd_config.d/99-arac-@@BASE@@-pont.conf
#     sudo sshd -t                 # TESTER la syntaxe, TOUJOURS, avant
#     sudo systemctl reload ssh    # (ou `sshd` selon la distribution)
#
# POURQUOI PAS `cp 99-arac-pont.conf /etc/ssh/sshd_config.d/`
# -----------------------------------------------------------
# Parce que tout le contenu utile de ce fichier est PROPRE À UN CERVEAU — le
# compte du tunnel, les deux numéros de port — et que le nom, lui, ne l'était
# pas. `/etc/ssh/sshd_config.d/` appartient à la MACHINE : le second cerveau
# installé écrasait le fragment du premier. Si les deux comptes de tunnel
# portaient le même nom, le `PermitOpen` du premier disparaissait et son
# tunnel mourait sur un « administratively prohibited ». S'ils différaient,
# c'est le bloc `Match` entier du premier qui disparaissait : son compte
# retombait sur la configuration globale, sans ForceCommand, sans PermitTTY
# no, sans PermitOpen, sans ClientAliveInterval. Le durcissement décrit
# ci-dessous comme la totalité de la surface exposée était retiré en silence
# par l'installation du voisin.
#
# ATTENTION, la seule vraie : gardez une session SSH ouverte pendant que vous
# faites cela. Si vous vous verrouillez dehors, cette session est votre seule
# porte de retour. Testez la reconnexion depuis un SECOND terminal avant de
# fermer le premier.
#
# ----------------------------------------------------------------------------
# CE QUE CE FICHIER PROTÈGE
# ----------------------------------------------------------------------------
#
# SSH est la seule porte de votre cerveau DEPUIS LE RÉSEAU. L'API et le
# cockpit n'écoutent que sur 127.0.0.1 : depuis l'Internet, ils n'existent
# pas. Ces quelques lignes, et la clé qui les franchit, portent donc toute la
# frontière EXTÉRIEURE.
#
# Elles ne portent pas tout, et il faut le dire ici plutôt qu'ailleurs : une
# fois sur la machine, 127.0.0.1 est un couloir que partagent tous les comptes
# locaux. Le tunnel dit d'où vient une requête, jamais qui l'envoie. C'est le
# jeton porteur qui fait la porte intérieure — exigé de toute requête, boucle
# locale comprise (app/auth.py). Les deux frontières sont nécessaires ; aucune
# ne dispense de l'autre.
#
# @@COMPTE_PONT@@ est le compte dédié au tunnel — il ne doit PAS être votre
# compte d'administration, et il porte le nom du cerveau (« pont-@@BASE@@ »)
# pour la même raison que ce fichier : deux `Match User pont` sur une même
# machine, et sshd n'applique que le premier. `rendre-pont.sh` le nomme pour
# vous.
# ============================================================================


# ----------------------------------------------------------------------------
# 1. Fermer ce qui n'a pas à être ouvert
# ----------------------------------------------------------------------------
# Un mot de passe se devine, se rejoue, se retrouve dans une fuite. Une clé,
# non. À partir du moment où votre clé fonctionne, cette ligne ne vous coûte
# rien et supprime la totalité des attaques par mot de passe.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes

# root ne se connecte jamais directement : on passe par un compte nommé, puis
# sudo. La différence n'est pas cosmétique — c'est la traçabilité de qui a
# fait quoi.
PermitRootLogin prohibit-password

# Trois essais, trente secondes : de quoi laisser passer un humain, pas un
# balayage automatique.
MaxAuthTries 3
LoginGraceTime 30


# ----------------------------------------------------------------------------
# 2. Le compte du tunnel — bridé au strict nécessaire
# ----------------------------------------------------------------------------
# Ce compte n'existe que pour transporter deux ports. Il n'a besoin ni de
# shell, ni de transfert de fichiers, ni d'agent, ni de terminal. Tout ce qui
# est refusé ici est une porte de moins le jour où la clé du Mac fuit.
#
# Le vrai bridage se joue dans le authorized_keys de ce compte
# (voir authorized_keys.modele) : c'est là que `permitopen` limite le tunnel
# aux DEUX ports du cerveau. Ce bloc est la seconde couche — les deux se
# valent mieux ensemble.

Match User @@COMPTE_PONT@@
    AllowTcpForwarding yes
    # LES DEUX NUMÉROS SONT CEUX DE **CE** CERVEAU, PAS DES CONSTANTES.
    # Ils ont été attribués à l'installation, après constat de disponibilité,
    # et écrits dans son fichier d'environnement (ARAC_API_PORT,
    # ARAC_COCKPIT_PORT dans /etc/arac/<base>/arac.env). Sur une machine qui
    # porte deux cerveaux, ce ne sont pas les mêmes des deux côtés : recopier
    # un numéro par habitude, c'est ouvrir un tunnel vers le cerveau du voisin.
    PermitOpen 127.0.0.1:@@PORT_API@@ 127.0.0.1:@@PORT_COCKPIT@@
    X11Forwarding no
    AllowAgentForwarding no
    PermitTTY no
    ForceCommand /usr/sbin/nologin

    # Le tunnel meurt, mais son cadavre occupe le port
    # ------------------------------------------------
    # Quand un Mac se met en veille ou change de réseau, sa session TCP ne se
    # ferme pas : elle se tait. Le serveur, lui, continue de croire la session
    # vivante et garde ses redirections. À la reconnexion, autossh trouve les
    # ports déjà pris et échoue — indéfiniment.
    #
    # Ces deux lignes font sonder le client par le serveur : trois silences
    # de trente secondes, et la session morte est libérée. C'est la panne de
    # tunnel la plus déroutante qui soit, et sa correction tient ici.
    ClientAliveInterval 30
    ClientAliveCountMax 3
Match all


# ----------------------------------------------------------------------------
# 3. Ce que ce fichier ne fait PAS, volontairement
# ----------------------------------------------------------------------------
#
# · Il ne change pas le port d'écoute de SSH. Déplacer le port réduit le bruit
#   des journaux, pas le risque : ce n'est pas de la sécurité, c'est du calme.
#   Faites-le si vous voulez, ce n'est pas la place de ce fichier.
#
# · Il n'active pas GatewayPorts. Jamais. Cette option ferait écouter les
#   ports redirigés sur toutes les interfaces du serveur : elle transformerait
#   votre tunnel privé en exposition publique, exactement ce qu'on refuse.
#
# · Il n'installe pas de bannissement automatique (fail2ban et ses cousins).
#   Utile, mais c'est un autre sujet, avec son propre risque : se bannir
#   soi-même. Décidez-le séparément, en connaissance de cause.
