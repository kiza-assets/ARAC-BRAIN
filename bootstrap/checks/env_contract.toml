# =============================================================================
# LE CONTRAT DES VARIABLES — ce que le code lit et que `.env.example` ne montre
# pas, avec le motif de chaque classement.
# =============================================================================
#
# POURQUOI CE FICHIER EXISTE
# --------------------------
# Le code de ce dépôt lit environ deux cents variables d'environnement.
# `.env.example` n'en montre qu'une quarantaine, et c'est un choix : un
# fichier canonique de deux cents entrées ne s'installe pas, il se subit.
# Personne ne lit une page de réglages dont 80 % ne le concernent pas — et
# c'est précisément comme ça qu'on rate la ligne qui, elle, comptait.
#
# Mais « on ne montre pas tout » doit être ÉCRIT, sinon c'est indistinguable
# d'un oubli. C'est le rôle de ce fichier : chaque variable lue par le code
# est soit dans `.env.example`, soit ici, dans un groupe qui dit POURQUOI elle
# n'a pas à figurer dans le fichier canonique.
#
# `bootstrap/checks/audit_env.py` échoue si une variable n'est ni documentée
# ni classée. Ajouter une variable au code oblige donc à trancher : est-ce que
# l'installateur doit la connaître ? Si oui, `.env.example`. Sinon, ici, avec
# le motif. Il n'y a pas de troisième réponse, et c'est le point.
#
# CE FICHIER N'EST PAS UNE DOCUMENTATION
# --------------------------------------
# Il ne dit pas ce que fait chaque variable ni quel est son défaut — le code
# est la source de vérité pour ça, et `docs/CONFIGURATION.md` en donne la
# lecture. Il dit une seule chose : « celle-ci, on a décidé de ne pas la
# mettre en première page, et voici pourquoi ». C'est un registre de
# décisions, pas un manuel.
# =============================================================================


# -----------------------------------------------------------------------------
# Les familles à préfixe
# -----------------------------------------------------------------------------
#
# Certaines variables n'ont pas de nom fixe : le code balaie l'environnement à
# la recherche d'un préfixe. `app/auth.py` construit sa table
# « jeton → poste » à partir de tout ce qui commence par `ARAC_NODE_TOKEN_`.
# Aucun nom complet n'existe donc dans le code, et c'est correct.

[familles]
prefixes = ["ARAC_NODE_TOKEN_"]


# -----------------------------------------------------------------------------

