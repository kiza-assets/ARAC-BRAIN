[[groupe]]
raison = """
POSÉES PAR L'UNITÉ, JAMAIS PAR L'INSTALLATEUR.

Le cockpit est le seul service qui doive savoir DE QUEL CERVEAU il est le
cockpit : il interroge l'API de ce cerveau-là et rapporte la santé de l'unité
de ce cerveau-là. Il l'ignorait — son collecteur d'API retombait sur le port
par défaut, et son collecteur de métriques demandait l'état de l'unité au nom
générique, c'est-à-dire, sur une machine à deux cerveaux, ceux du VOISIN. Une
page de cockpit affichait alors la taxonomie et la santé d'un autre, sans une
seule erreur.

`bootstrap/lib/services.sh` écrit ces deux noms dans l'unité du cockpit, d'où
ils sortent déjà calculés. Les mettre dans le fichier canonique ferait croire
qu'il faut les choisir : ils se DÉDUISENT du nom du cerveau, et une valeur
recopiée à la main y serait précisément le défaut qu'on vient de fermer.
"""
variables = ["ARAC_UNIT_API", "ARAC_UNIT_COCKPIT"]


[[groupe]]
raison = """
DES ÉCHAPPATOIRES NOMMÉES, POUR UNE INSTALLATION QUI SORT DE LA CONVENTION.

Aucune des deux n'a besoin d'être posée : chacune a une valeur DÉRIVÉE du
cerveau, et c'est cette dérivation qui est la correction. Elles existent pour
qu'une installation qui a nommé ses objets autrement puisse le dire, au lieu
d'être obligée de retomber sur un nom commun.

`ARAC_UNIT_CURATEUR` — l'unité de digestion dont le cockpit rapporte l'état.
Le collecteur nommait `arac-curator-batch.service` en toutes lettres : une
unité qu'aucun bootstrap ne pose, et qui, sur une machine à deux cerveaux,
désignait celle du voisin. Elle se déduit désormais de `ARAC_UNIT_PREFIX` ;
sans préfixe, le cockpit rend « inconnu » avec sa raison, jamais un état.

`ARAC_COMPTE_PONT` — le compte Unix du tunnel SSH. Il porte par défaut le nom
du cerveau (`pont-<base>`), parce que deux `Match User pont` dans deux
fragments sshd ne cohabitent pas : sshd applique le premier, et le durcissement
du second n'existe pas.

Les mettre dans le fichier canonique ferait croire qu'il faut les choisir. Il
ne faut pas : il faut pouvoir en sortir, ce qui n'est pas la même chose.
"""
variables = ["ARAC_UNIT_CURATEUR", "ARAC_COMPTE_PONT"]


[[groupe]]
raison = """
NI POSÉE NI LUE : ÉCRITE ET RELUE PAR LE BOOTSTRAP, DANS LA MÊME SECONDE.

`ARAC_VARS_APPELANT` n'est pas un réglage — c'est un CONSTAT. `bootstrap/lib/core.sh`
relève, avant toute résolution, lesquelles des quatre variables d'implantation
(`ARAC_DB_HOTE`, `ARAC_DB_PORT`, `ARAC_API_PORT`, `ARAC_COCKPIT_PORT`) l'appelant
a posées lui-même, pour que toute commande IMPRIMÉE par le bootstrap les reporte
et atterrisse là où l'invocation qui l'imprime a atterri. C'est le seul instant
où l'on peut distinguer « la grappe par défaut parce que vous l'avez demandée »
de « la grappe par défaut faute de mieux » — la seconde étant, sur un serveur
qui héberge déjà un cerveau, celle du voisin.

La poser à la main n'aurait aucun effet utile : elle est écrasée au chargement
de `core.sh`. La documenter dans `.env.example` ferait croire le contraire.

`ARAC_BACKUP_RETENTION_DEFAUT` est le DÉFAUT de la rétention, nommé une seule
fois pour que l'écran de l'étape 9 puisse citer « ce nombre n'est retenu nulle
part : un bootstrap relancé sans lui le ramène à 14 jours » sans citer la
valeur courante — la citer disait « le ramène à 90 » juste après qu'on eut posé
90, c'est-à-dire l'inverse exact de l'avertissement.
"""
variables = ["ARAC_VARS_APPELANT", "ARAC_BACKUP_RETENTION_DEFAUT"]


[[groupe]]
raison = """
UNE VARIABLE QUI N'EXISTE QUE POUR QUE LA GARDE SOIT ÉPROUVABLE.

`ARAC_ETC_DIR` est la racine des coffres — `/etc/arac` sur toute installation
réelle, et rien d'autre. L'installateur n'a rien à poser : la déplacer casserait
le `EnvironmentFile=` des unités, que le bootstrap écrit en absolu.

Elle existe parce que la règle qui décide À QUEL CERVEAU s'adresse une commande
d'`ops/` — cinq rangs écrits au-dessus de `ops/env.sh` — ne pouvait, sans elle,
être éprouvée que sur une machine portant de vrais cerveaux, c'est-à-dire jamais
dans `make test`, qui est hermétique. C'est très exactement ainsi que cette
garde avait disparu du code sans que sept pages l'apprennent : personne ne
pouvait la faire rougir. `tests/test_ops_env_nomme_le_cerveau_qu_il_sert.py`
donne à `ops/env.sh` un faux `/etc` sous `tmp_path` et mesure les cinq rangs, un
par un.

`ops/install_check.sh` et `ops/uninstall_check.sh` la lisent pour la même raison
et avec le même défaut : « où vivent les coffres ? » n'a qu'une réponse dans ce
dépôt, et deux conventions voisines pour la même question est la classe de
