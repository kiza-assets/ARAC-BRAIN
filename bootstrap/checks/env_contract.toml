[[groupe]]
raison = """
NI POSÉE NI DOCUMENTABLE : UNE MÉMOIRE INTERNE AU PONT, D'UNE LIGNE À L'AUTRE.

`ARAC_CERVEAU_DEMANDE` n'est pas un réglage — c'est ce que l'appelant a DEMANDÉ,
gardé à part de ce que le script a DÉDUIT. `resoudre_cerveau` écrase
`ARAC_CERVEAU` par « l'unique cerveau connu » quand il n'y en a qu'un ; or
`installer` sert justement à en ajouter un SECOND, et proposerait alors le nom
du premier comme valeur par défaut — c'est-à-dire réinstallerait par-dessus lui.
Le script relève donc la demande explicite avant toute résolution, et ne propose
un défaut que s'il y en avait une.

La poser à la main n'a aucun sens : elle est écrite à la ligne 58 de
`mac/arac-pont.sh`, à partir de `ARAC_CERVEAU`, avant que quoi que ce soit ne
la lise. La documenter dans `.env.example` ferait croire qu'il existe deux
façons de nommer son cerveau ; il n'y en a qu'une, `ARAC_CERVEAU`, et elle est
déjà classée au-dessus.

CE QUE SON ABSENCE A COÛTÉ, ET POURQUOI CE GROUPE EXISTE PLUTÔT QU'UNE LIGNE
AJOUTÉE AU GROUPE VOISIN : elle a été introduite par le correctif du
cloisonnement du pont, et rangée nulle part. `audit_env.py` — contrôle 0 de
`bootstrap/checks/verify_install.sh`, joué par le bootstrap à son étape 10 ET
par la SIMULATION avant toute écriture — l'a déclarée NON CLASSÉE et a rendu 1.
Quatre rouges dans `make test`, `bootstrap.sh --dry-run` en code 1 à l'étape 3
du démarrage rapide, et « Ce cerveau n'est pas sain » sur une installation
pourtant réussie. Le produit avait avancé ; sa déclaration était restée en
arrière. C'est cette famille-là que ce groupe nomme, pour que la suivante se
range ici sans hésiter.
"""
variables = ["ARAC_CERVEAU_DEMANDE"]


